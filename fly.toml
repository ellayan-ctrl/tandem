# Change the app name: it becomes https://<app>.fly.dev and must be unique.
app = "tandem-demo"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/twoway.db"

# Keeps the SQLite database across deploys and restarts.
[mounts]
  source = "tandem_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # The expiry worker must keep running, so the machine never stops.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
